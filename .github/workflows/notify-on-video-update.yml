name: Send Push Notification on Video Update

on:
  push:
    branches:
      - main
    paths:
      - 'videos.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect newly added video
        id: detect
        run: |
          if git show HEAD~1:videos.json > /tmp/old_videos.json 2>/dev/null; then
            OLD_COUNT=$(jq '.videos | length' /tmp/old_videos.json 2>/dev/null || echo 0)
          else
            OLD_COUNT=0
          fi
          
          NEW_COUNT=$(jq '.videos | length' videos.json)
          
          echo "Old videos count: $OLD_COUNT"
          echo "New videos count: $NEW_COUNT"
          
          if [ "$NEW_COUNT" -gt "$OLD_COUNT" ]; then
            TITLE=$(jq -r '.videos[0].title // "New video"' videos.json)
            CATEGORY=$(jq -r '.videos[0].category // ""' videos.json)
            CLIENT=$(jq -r '.videos[0].client // ""' videos.json)
            
            echo "send_push=true" >> $GITHUB_OUTPUT
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "category=$CATEGORY" >> $GITHUB_OUTPUT
            echo "client=$CLIENT" >> $GITHUB_OUTPUT
            
            echo "📢 New video detected: $TITLE ($CATEGORY)"
          else
            echo "ℹ️ No new video added — skipping push"
            echo "send_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Send OneSignal Push
        if: steps.detect.outputs.send_push == 'true'
        run: |
          TITLE="${{ steps.detect.outputs.title }}"
          CATEGORY="${{ steps.detect.outputs.category }}"
          
          if [ -n "$CATEGORY" ] && [ "$CATEGORY" != "null" ]; then
            MESSAGE="$TITLE — $CATEGORY"
          else
            MESSAGE="$TITLE"
          fi
          
          echo "📤 Sending push: $MESSAGE"
          
          RESPONSE=$(curl -s -X POST https://onesignal.com/api/v1/notifications \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Key ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            -d "{
              \"app_id\": \"${{ secrets.ONESIGNAL_APP_ID }}\",
              \"included_segments\": [\"Subscribed Users\"],
              \"headings\": {\"en\": \"New video on Bufi App 🎬\"},
              \"contents\": {\"en\": \"$MESSAGE\"},
              \"ios_badgeType\": \"Increase\",
              \"ios_badgeCount\": 1
            }")
          
          echo "OneSignal response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"errors"'; then
            echo "❌ Push failed"
            exit 1
          else
            echo "✅ Push sent successfully"
          fi
