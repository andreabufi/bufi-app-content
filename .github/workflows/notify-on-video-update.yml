name: Send Push Notification on Video Update

on:
  push:
    branches:
      - main
    paths:
      - 'videos.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect newly added video
        id: detect
        run: |
          # Get old version of videos.json
          if git show HEAD~1:videos.json > /tmp/old_videos.json 2>/dev/null; then
            OLD_COUNT=$(jq '.videos | length' /tmp/old_videos.json 2>/dev/null || echo 0)
          else
            echo "No previous version found"
            OLD_COUNT=0
            echo "[]" > /tmp/old_youtube_ids.json
          fi
          
          NEW_COUNT=$(jq '.videos | length' videos.json)
          
          echo "Old count: $OLD_COUNT"
          echo "New count: $NEW_COUNT"
          
          if [ "$NEW_COUNT" -le "$OLD_COUNT" ]; then
            echo "ℹ️ No new video added (count did not grow) — skipping push"
            echo "send_push=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get list of youtubeIDs in old version
          if [ -f /tmp/old_videos.json ]; then
            jq -r '.videos[].youtubeID' /tmp/old_videos.json > /tmp/old_ids.txt 2>/dev/null || touch /tmp/old_ids.txt
          else
            touch /tmp/old_ids.txt
          fi
          
          # Find the youtubeID that exists in NEW but not in OLD
          NEW_VIDEO=$(jq -c --slurpfile old /tmp/old_videos.json '
            .videos | map(select(
              .youtubeID as $id | 
              ($old[0].videos // [] | map(.youtubeID) | index($id)) == null
            )) | .[0] // empty
          ' videos.json)
          
          if [ -z "$NEW_VIDEO" ] || [ "$NEW_VIDEO" = "null" ]; then
            echo "⚠️ Count grew but no new youtubeID detected — skipping push"
            echo "send_push=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          TITLE=$(echo "$NEW_VIDEO" | jq -r '.title // "New video"')
          CATEGORY=$(echo "$NEW_VIDEO" | jq -r '.category // ""')
          YOUTUBE_ID=$(echo "$NEW_VIDEO" | jq -r '.youtubeID // ""')
          
          echo "📢 New video detected: $TITLE ($CATEGORY) [$YOUTUBE_ID]"
          
          echo "send_push=true" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "category=$CATEGORY" >> $GITHUB_OUTPUT

      - name: Send OneSignal Push
        if: steps.detect.outputs.send_push == 'true'
        run: |
          TITLE="${{ steps.detect.outputs.title }}"
          CATEGORY="${{ steps.detect.outputs.category }}"
          
          if [ -n "$CATEGORY" ] && [ "$CATEGORY" != "null" ]; then
            MESSAGE="$TITLE — $CATEGORY"
          else
            MESSAGE="$TITLE"
          fi
          
          echo "📤 Sending push: $MESSAGE"
          
          RESPONSE=$(curl -s -X POST https://onesignal.com/api/v1/notifications \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Key ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            -d "{
              \"app_id\": \"${{ secrets.ONESIGNAL_APP_ID }}\",
              \"included_segments\": [\"Total Subscriptions\"],
              \"headings\": {\"en\": \"New video on Bufi App 🎬\"},
              \"contents\": {\"en\": \"$MESSAGE\"},
              \"ios_badgeType\": \"Increase\",
              \"ios_badgeCount\": 1
            }")
          
          echo "OneSignal response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"errors"'; then
            echo "❌ Push failed"
            exit 1
          else
            echo "✅ Push sent successfully"
          fi
